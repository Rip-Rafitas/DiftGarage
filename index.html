<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Garage - Jogo com Bots</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        #menuContainer {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            border: 2px solid #ff4500;
            max-width: 400px;
            width: 90%;
        }
        #menuContainer h1 {
            color: #ff4500;
            font-size: 2.5rem;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #menuContainer p {
            color: #aaa;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        #playerNameInput {
            width: 80%;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 25px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
        }
        #playerNameInput:focus {
            border-color: #ff4500;
        }
        #startBtn {
            background: linear-gradient(135deg, #ff4500, #b30000);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.6);
        }
        #gameContainer {
            display: none;
            text-align: center;
        }
        #gameUi {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            max-width: 100%;
            margin-bottom: 10px;
            padding: 0 10px;
            box-sizing: border-box;
        }
        #playerGreeting {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        #score {
            font-size: 22px;
            font-weight: bold;
            color: #ff4500;
        }
        canvas {
            background-color: #282828;
            border: 4px solid #ff4500;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
        }
        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="menuContainer">
        <h1>Drift Garage</h1>
        <p>Prepara a tua máquina e enfrenta os Bots</p>
        <div class="input-group">
            <input type="text" id="playerNameInput" placeholder="Digita o teu nome..." maxlength="15" autocomplete="off">
        </div>
        <button id="startBtn">Jogar</button>
    </div>
    <div id="gameContainer">
        <div id="gameUi">
            <div id="playerGreeting">Piloto: <span id="displayPlayerName" style="color: #ff4500;"></span></div>
            <div id="score">Pontos: 0</div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="controls-info">
            <strong>Controlos:</strong> Usa as Setas Esquerda/Direita (ou A/D) para curvar e fazer drift!
        </div>
    </div>
    <script>
        const menuContainer = document.getElementById("menuContainer");
        const gameContainer = document.getElementById("gameContainer");
        const playerNameInput = document.getElementById("playerNameInput");
        const startBtn = document.getElementById("startBtn");
        const displayPlayerName = document.getElementById("displayPlayerName");
        const scoreElement = document.getElementById("score");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let gameOver = false;
        let gameStarted = false;
        let playerName = "Piloto";

        startBtn.addEventListener("click", startGame);
        playerNameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") startGame();
        });

        function startGame() {
            if (playerNameInput.value.trim() !== "") {
                playerName = playerNameInput.value.trim();
            }
            displayPlayerName.innerText = playerName;
            menuContainer.style.display = "none";
            gameContainer.style.display = "block";
            gameStarted = true;
            resetGame();
        }

        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 90,
            width: 32,
            height: 55,
            speed: 7,
            driftAngle: 0,
            maxDrift: 18
        };

        const bots = [];
        const botCount = 4;
        const botColors = ["#888888", "#3a5fcd", "#008b45", "#cd8500"];

        function createBot(index) {
            return {
                x: Math.random() * (canvas.width - 40) + 5,
                y: -Math.random() * 400 - (index * 160) - 100,
                width: 32,
                height: 55,
                speed: Math.random() * 3 + 5,
                color: botColors[Math.floor(Math.random() * botColors.length)]
            };
        }

        const keys = {};
        window.addEventListener("keydown", (e) => { if(gameStarted) keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { if(gameStarted) keys[e.key] = false; });

        function drawCar(x, y, width, height, color, angle = 0) {
            ctx.save();
            ctx.translate(x + width / 2, y + height / 2);
            ctx.rotate(angle * Math.PI / 180);
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(-width / 2 + 4, -height / 2 + 4, width, height);
            ctx.fillStyle = color;
            ctx.fillRect(-width / 2, -height / 2, width, height);
            ctx.fillStyle = "#111";
            ctx.fillRect(-width / 2 - 2, height / 2 - 4, width + 4, 5);
            ctx.fillStyle = "#add8e6";
            ctx.fillRect(-width / 2 + 3, -height / 2 + 10, width - 6, 12);
            ctx.fillRect(-width / 2 + 3, -height / 2 + 28, width - 6, 8);
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(-width / 2 + 3, -height / 2, 6, 3);
            ctx.fillRect(width / 2 - 9, -height / 2, 6, 3);
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(-width / 2 + 2, height / 2 - 2, 5, 2);
            ctx.fillRect(width / 2 - 7, height / 2 - 2, 5, 2);
            ctx.restore();
        }

        function update() {
            if (!gameStarted) return;
            if (gameOver) {
                if (keys["ArrowLeft"] || keys["ArrowRight"] || keys["a"] || keys["d"]) {
                    resetGame();
                }
                return;
            }
            if (keys["ArrowLeft"] || keys["a"]) {
                if (player.x > 5) player.x -= player.speed;
                if (player.driftAngle > -player.maxDrift) player.driftAngle -= 2.5;
            } else if (keys["ArrowRight"] || keys["d"]) {
                if (player.x < canvas.width - player.width - 5) player.x += player.speed;
                if (player.driftAngle < player.maxDrift) player.driftAngle += 2.5;
            } else {
                if (player.driftAngle > 0) player.driftAngle -= 1.5;
                if (player.driftAngle < 0) player.driftAngle += 1.5;
                if (Math.abs(player.driftAngle) < 1.5) player.driftAngle = 0;
            }
            bots.forEach((bot, index) => {
                bot.y += bot.speed;
                if (bot.y > canvas.height) {
                    score += 10;
                    scoreElement.innerText = "Pontos: " + score;
                    bots[index] = createBot(index);
                }
                if (
                    player.x < bot.x + bot.width &&
                    player.x + player.width > bot.x &&
                    player.y < bot.y + bot.height &&
                    player.y + player.height > bot.y
                ) {
                    gameOver = true;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 3;
            for (let i = 0; i < canvas.width; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            bots.forEach(bot => {
                drawCar(bot.x, bot.y, bot.width, bot.height, bot.color);
            });
            drawCar(player.x, player.y, player.width, player.height, "#ff4500", player.driftAngle);
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4500";
                ctx.font = "bold 38px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FIM DA CORRIDA, " + playerName.toUpperCase() + "!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("Carrega nas Setas ou A/D para voltar à pista", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = "Pontos: " + score;
            player.x = canvas.width / 2 - player.width / 2;
            player.driftAngle = 0;
            gameOver = false;
            bots.length = 0;
            for (let i = 0; i < botCount; i++) {
                bots.push(createBot(i));
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
